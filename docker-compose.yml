services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: emotion-recognition-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DISABLE_TRANSFORMER=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - emotion-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: emotion-recognition-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - FASTAPI_URL=http://backend:8000
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - emotion-network

networks:
  emotion-network:
    driver: bridge

