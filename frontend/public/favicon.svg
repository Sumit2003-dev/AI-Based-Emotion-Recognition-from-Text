<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#0f0f12" />
    </radialGradient>

    <!-- Compass Dial Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="25%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="75%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Needle Gradient North -->
    <linearGradient id="needleNorth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Needle Gradient South -->
    <linearGradient id="needleSouth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Badge Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#27272a" stroke-width="1.5"/>

  <!-- Compass Outer Dial Ring (6-Signal Spectrum) -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.85" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#3f3f46" stroke-width="0.75" stroke-dasharray="2,2"/>

  <!-- Six Emotion Signal Nodes at 60 deg intervals -->
  <!-- Top: Happy (Gold) -->
  <circle cx="32" cy="9" r="3" fill="#eab308" />
  <!-- Top-Right: Surprise (Cyan) -->
  <circle cx="51.9" cy="20.5" r="3" fill="#06b6d4" />
  <!-- Bottom-Right: Neutral (Slate) -->
  <circle cx="51.9" cy="43.5" r="3" fill="#94a3b8" />
  <!-- Bottom: Sad (Blue) -->
  <circle cx="32" cy="55" r="3" fill="#3b82f6" />
  <!-- Bottom-Left: Fear (Purple) -->
  <circle cx="12.1" cy="43.5" r="3" fill="#a855f7" />
  <!-- Top-Left: Angry (Red) -->
  <circle cx="12.1" cy="20.5" r="3" fill="#ef4444" />

  <!-- Compass Star / Pointer (North Pointing to Happy, South Pointing to Sad) -->
  <polygon points="32,15 35.5,32 32,29.5 28.5,32" fill="url(#needleNorth)" filter="url(#glow)"/>
  <polygon points="32,49 35.5,32 32,34.5 28.5,32" fill="url(#needleSouth)"/>
  <polygon points="17,32 32,28.5 29.5,32 32,35.5" fill="#ef4444" opacity="0.9"/>
  <polygon points="47,32 32,28.5 34.5,32 32,35.5" fill="#06b6d4" opacity="0.9"/>

  <!-- Compass Center Pivot -->
  <circle cx="32" cy="32" r="4" fill="#18181b" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="1.5" fill="#ffffff"/>
</svg>
